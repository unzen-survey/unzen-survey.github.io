<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Unzen Guest Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+TC:wght@400;600&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
/* 公式サイト kyushuhtl.co.jp に合わせる：本文 Noto Serif JP・英字 Cormorant Garamond・文字 #333・地 白・差し色 #887753（ボタン角丸5px） */
:root{--bg:#ffffff;--panel:#faf8f4;--line:#e3ddd1;--text:#333333;--muted:#6f6a61;--gold:#887753;--gold-d:#6e5f40;--gold-l:#aca087;--ink:#ffffff;--hl:#6e5f40;--red:#a33a2a}
html,body{margin:0;background:var(--bg)}
#us{color:var(--text);font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:15px;line-height:1.9;letter-spacing:.03em;max-width:560px;margin:0 auto;padding:16px 16px 48px;box-sizing:border-box;-webkit-text-size-adjust:100%}
#us[lang="zh-Hant"]{font-family:"Noto Serif TC","Noto Serif JP","Songti TC",serif}
#us[lang="ko"]{font-family:"Noto Serif KR","Noto Serif JP","AppleMyungjo",serif}
#us[lang="en"]{font-family:"Noto Serif JP","Hiragino Mincho ProN",serif}
#us *{box-sizing:border-box}
#us button,#us input{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#us .us-proto{background:#f6f2e9;border:1px solid var(--line);color:var(--gold-d);border-radius:5px;font-size:12px;padding:6px 10px;margin-bottom:14px;text-align:center}
#us .us-top{display:flex;flex-direction:column;align-items:center;gap:14px;margin:6px 0 30px}
#us .us-logo img{display:block;width:180px;height:auto}
#us .us-lang{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
#us .us-lang button{background:none;border:1px solid var(--line);border-radius:5px;padding:2px 12px;font-size:12px;color:var(--muted);letter-spacing:.04em}
#us .us-lang button.on{border-color:var(--gold);color:var(--gold-d)}
#us .us-en{font-family:"Cormorant Garamond",serif;color:var(--gold);font-size:13px;letter-spacing:.12em;text-align:center;margin:0 0 2px}
#us h1{font-weight:400;font-size:19px;line-height:1.6;margin:0 0 10px;letter-spacing:.1em;color:var(--gold);text-align:center}
#us .us-sub{color:var(--muted);font-size:13px;margin:0 0 26px;text-align:center}
#us .us-sec{border-top:1px solid var(--line);padding:24px 0 4px}
#us .us-h{font-size:14.5px;font-weight:600;margin:0 0 12px;letter-spacing:.08em}
#us .us-note{color:var(--muted);font-size:12px;margin:-6px 0 12px}
#us .us-stars{display:flex;gap:6px;justify-content:center;margin:4px 0 6px}
#us .us-star{background:none;border:0;padding:4px;line-height:0}
#us .us-star svg{width:42px;height:42px;display:block}
#us .us-star path{fill:none;stroke:var(--gold-l);stroke-width:1.3;transition:fill .15s,stroke .15s}
#us .us-star.on path{fill:var(--gold);stroke:var(--gold)}
#us .us-starlabel{text-align:center;color:var(--gold-d);font-size:13px;min-height:22px;margin-bottom:8px;letter-spacing:.1em}
#us .us-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
#us .us-chip{background:#fff;border:1px solid var(--line);border-radius:5px;padding:7px 13px;font-size:13.5px;line-height:1.35;color:var(--text);transition:background .15s,border-color .15s,opacity .15s}
#us .us-chip.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
#us .us-chip.bad.on{background:#4a4640;border-color:#4a4640;color:#fff}
#us .us-chip:disabled{opacity:.4;cursor:default}
#us .us-card{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:16px 14px 6px;margin-bottom:12px}
#us .us-card-t{font-size:13px;color:var(--gold-d);margin-bottom:8px;letter-spacing:.08em;font-weight:600}
#us .us-card-t.bad{color:#4a4640}
#us .us-q{font-size:13.5px;margin:0 0 8px}
#us .us-q2{margin-top:6px}
#us .us-other{width:100%;background:#fff;border:1px solid var(--line);border-radius:5px;color:var(--text);font-size:16px;padding:8px 10px;margin:-4px 0 14px;cursor:text}
#us .us-text{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:16px;min-height:140px;line-height:2;font-size:15px;outline:none;white-space:pre-wrap;word-break:break-word}
#us .us-text:focus{border-color:var(--gold)}
#us .us-hl{color:var(--hl);font-weight:600}
#us .us-row{display:flex;justify-content:flex-end;margin:8px 0 4px}
#us .us-link{background:none;border:0;color:var(--gold-d);font-size:13px;padding:6px 0;text-decoration:underline;text-underline-offset:4px}
#us .us-check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:4px 0 4px;cursor:pointer}
#us .us-check input{margin-top:6px;accent-color:var(--gold);width:16px;height:16px;flex:none}
#us .us-submit{display:block;width:100%;margin-top:22px;background:var(--gold);color:var(--ink);border:0;border-radius:5px;padding:14px;font-size:15px;letter-spacing:.2em}
#us .us-submit:disabled{opacity:.35;cursor:default}
#us .us-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#us .us-done{padding:6px 0 8px}
#us .us-done h1{font-size:clamp(16px,5vw,19px)}
#us .us-done .us-h{margin-top:8px}
#us .us-ask{font-size:14px;line-height:2;margin:32px 0 0}
#us .us-copy{margin-top:16px}
#us .us-dest-row{display:flex;justify-content:center;gap:22px;margin-top:24px;flex-wrap:wrap}
#us .us-ico{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:12px;letter-spacing:.03em;text-decoration:none;max-width:84px;text-align:center;line-height:1.4}
#us .us-ico-c{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;font-weight:700;font-size:12px;letter-spacing:0;line-height:1.1;text-align:center}
#us .us-ico svg{width:30px;height:30px;display:block}
#us .us-google .us-ico-c{background:#fff;border:1px solid var(--line)}
#us .us-ikyu .us-ico-c{background:#1a1a1a;color:#e5c88a;font-family:"Noto Serif JP",serif;font-size:17px;font-weight:400}
#us .us-rakuten .us-ico-c{background:#bf0000;font-size:11px}
#us .us-trip .us-ico-c{background:#34e0a1;color:#000;font-size:10.5px}
#us .us-booking .us-ico-c{background:#003580;font-size:11px}
#us .us-ico.us-unset{opacity:.45}
#us .us-dest-note{margin:12px 0 0}
#us .us-foot{font-family:"Cormorant Garamond",serif;color:var(--gold-l);font-size:13px;text-align:center;margin-top:44px;letter-spacing:.25em}
</style>
</head>
<body>
<div id="us" lang="ja"></div>
<script>
(function(){

  var ENDPOINT = "";

  // ───── 選択肢と文章 ─────

  var TERMS = {

  // 用語ごとの詳細（slots）とひな形（tpl）。{a} に選んだ内容が色付きで入る

    good:{

             en:["The open-air bath in our room was perfect — {a} made it special, and we bathed again and again.","What we loved most about the in-room open-air bath was {a}; we enjoyed Unzen's hot spring to the full.","The open-air bath in the room was so soothing that we used it many times."],

      room:{slots:[{k:"a",max:2,q:Q_GOOD,opts:O([

  function chipGroup(list, selected, max, onToggle, cls){
    var wrap = el("div", {"class":"us-chips"});
    list.forEach(function(item){
      var on = selected.indexOf(item.id) >= 0;
      var b = el("button", {type:"button", "class":"us-chip" + (cls ? " " + cls : "") + (on ? " on" : ""), "aria-pressed": on ? "true" : "false"}, esc(item.label));
      if (!on && selected.length >= max) b.disabled = true;
      b.onclick = function(){ onToggle(item.id); };
      wrap.appendChild(b);
    });
    return wrap;
  }
  function renderTerms(){
    refs.terms.innerHTML = "";
    if (!S.stars) return;
    var mk = function(side, order, heading){
      var sec = el("div", {"class":"us-sec"}); sec.appendChild(el("div", {"class":"us-h"}, esc(heading)));
      var arr = S[side], max = side === "good" ? 2 : 3;
      sec.appendChild(chipGroup(order.map(function(t){ return {id:t, label:TERMS[t][S.lang]}; }), arr, max, function(id){
        var i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); else if (arr.length < max) arr.push(id);
        renderTerms(); renderDetails();
      }, side === "bad" ? "bad" : ""));
      refs.terms.appendChild(sec);
    };
    mk("good", GOOD_ORDER, L().good);
    if (S.stars <= 4) mk("bad", BAD_ORDER, L().bad);
  }
  function renderDetails(){
    refs.details.innerHTML = "";
    var items = S.good.map(function(t){ return ["good", t]; }).concat(S.bad.map(function(t){ return ["bad", t]; }));
    if (!items.length) return;
    var sec = el("div", {"class":"us-sec"}); sec.appendChild(el("div", {"class":"us-h"}, esc(L().detail)));
    items.forEach(function(it){
      var side = it[0], term = it[1], slot = DETAIL[side][term].slots[0], d = getDet(side, term);
      var card = el("div", {"class":"us-card"});
      card.appendChild(el("div", {"class":"us-card-t" + (side === "bad" ? " bad" : "")}, esc((side === "good" ? L().goodPick : L().badPick) + "｜" + TERMS[term][S.lang])));
      card.appendChild(el("p", {"class":"us-q"}, esc(slot.q[S.lang])));
      var list = slot.opts.map(function(o){ return {id:o.id, label:o[S.lang]}; }); list.push({id:"__other", label:L().other});
      var selected = d.a.slice(); if (d.aOtherOn) selected.push("__other");
      card.appendChild(chipGroup(list, selected, slot.max, function(id){
        if (id === "__other") d.aOtherOn = !d.aOtherOn;
        else { var i = d.a.indexOf(id); if (i >= 0) d.a.splice(i, 1); else if (selected.length < slot.max) d.a.push(id); }
        renderDetails();
      }, side === "bad" ? "bad" : ""));
      if (d.aOtherOn){
        var inp = el("input", {"class":"us-other", type:"text", maxlength:"60", placeholder:L().otherPh});
        inp.value = d.aOther;
        inp.addEventListener("input", function(){ d.aOther = inp.value; });
        card.appendChild(inp);
      }
      var note = DETAIL[side][term].note;
      if (note){
        card.appendChild(el("p", {"class":"us-q us-q2"}, esc(note.q[S.lang])));
        var ni = el("input", {"class":"us-other", type:"text", maxlength:"60", placeholder:note.ph[S.lang]});
        ni.value = d.note;
        ni.addEventListener("input", function(){ d.note = ni.value; });
        card.appendChild(ni);
      }
      sec.appendChild(card);
    });
    refs.details.appendChild(sec);
  }
  function renderScene(){
    refs.scene.innerHTML = "";
    if (!S.stars) return;
    var sec = el("div", {"class":"us-sec"}); sec.appendChild(el("div", {"class":"us-h"}, esc(L().scene)));
    sec.appendChild(chipGroup(SCENES.map(function(x){ return {id:x.id, label:x[S.lang]}; }), S.scene ? [S.scene] : [], 99, function(id){
      S.scene = S.scene === id ? "" : id; renderScene();
    }, ""));
    refs.scene.appendChild(sec);
  }
  function updateSubmit(){ refs.submit.disabled = !S.stars; refs.sendSec.style.display = S.stars ? "" : "none"; }

  // スプレッドシート用に、日本語の表示名で「用語（値・値・その他:…）」の形にまとめる
  function detailText(side){
    return S[side].map(function(term){
      var slot = DETAIL[side][term].slots[0], d = getDet(side, term);
      var v = d.a.map(function(id){ var o = slot.opts.filter(function(x){ return x.id === id; })[0]; return o ? o.ja : id; });
      if (d.aOtherOn && d.aOther.trim()) v.push("その他:" + d.aOther.trim());
      if (d.note && d.note.trim()) v.push("心に残ったスタッフ:" + d.note.trim());
      return TERMS[term].ja + (v.length ? "（" + v.join("・") + "）" : "");
    }).join("\n");
  }
  function copyFallback(t){
    var ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta);
    return ok;
  }
  function copyText(t){
    if (copyFallback(t)) return Promise.resolve();
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
    return Promise.reject();
  }
  function plain(html){ var t = document.createElement("div"); t.innerHTML = html; return t.textContent; }
  function currentText(){ return refs.post ? refs.post.innerText.trim() : plain(S.postHTML).trim(); }

  // 送信後の画面。REVIEW_MIN_STARS 未満はお礼だけ。以上なら文章（編集可）・別の言い回し・口コミのお願い・コピー・投稿先
  function buildDone(){
    var box = el("div", {"class":"us-done"});
    box.appendChild(el("div", {"class":"us-en"}, "Thank you"));
    box.appendChild(el("h1", null, esc(L().doneTitle)));
    if (S.stars < REVIEW_MIN_STARS){ root.appendChild(box); return; }
    box.appendChild(el("p", {"class":"us-sub"}, esc(L().thanksP)));
    box.appendChild(el("div", {"class":"us-h"}, esc(L().text)));
    box.appendChild(el("p", {"class":"us-note"}, esc(L().textNote)));
    refs.post = el("div", {"class":"us-text", contenteditable:"true", role:"textbox", "aria-multiline":"true", spellcheck:"false"});
    refs.post.innerHTML = S.postHTML;
    refs.post.addEventListener("input", function(){ S.edited = true; S.postHTML = refs.post.innerHTML; queueUpdate(); });
    box.appendChild(refs.post);
    var row = el("div", {"class":"us-row"});
    var regen = el("button", {type:"button", "class":"us-link"}, esc(L().regen));
    regen.onclick = function(){
      if (S.edited && !window.confirm(L().regenConfirm)) return;
      S.picks = {}; S.edited = false; S.postHTML = generate(); refs.post.innerHTML = S.postHTML; queueUpdate();
    };
    row.appendChild(regen); box.appendChild(row);
    box.appendChild(el("p", {"class":"us-ask"}, esc(L().ask)));
    var copyBtn = el("button", {type:"button", "class":"us-submit us-copy"}, esc(L().copy));
    var markCopied = function(){ copyBtn.textContent = L().copied; };
    copyBtn.onclick = function(){ flushUpdate(); copyText(currentText()).then(markCopied, function(){}); track("copy"); };
    box.appendChild(copyBtn);
    var row2 = el("div", {"class":"us-dest-row"});
    DEST_BY_LANG[S.lang].forEach(function(dk){
      var dest = DEST[dk], unset = !dest.url;
      var a = el("a", {"class":"us-ico us-" + dk + (unset ? " us-unset" : ""), href: unset ? "#" : dest.url, target:"_blank", rel:"noopener"},
        '<span class="us-ico-c">' + dest.icon + "</span>" + esc(dest.label[S.lang] + (unset ? L().unset : "")));
      a.onclick = function(e){ if (unset) e.preventDefault(); flushUpdate(); copyText(currentText()).then(markCopied, function(){}); track(dk); };
      row2.appendChild(a);
    });
    box.appendChild(row2);
    box.appendChild(el("p", {"class":"us-note us-dest-note"}, esc(L().destNote)));
    root.appendChild(box);
  }

  // ───── 送信（画面はすぐ切り替え、データは裏で送る）─────
  function post(body, beacon){
    if (!ENDPOINT){ console.log("[unzen-survey]", body.type || "insert", body); return; }
    var data = JSON.stringify(body);
    if (beacon && navigator.sendBeacon){ try { if (navigator.sendBeacon(ENDPOINT, data)) return; } catch (e) {} }
    var tries = 0;
    (function go(){
      fetch(ENDPOINT, {method:"POST", mode:"no-cors", keepalive:true, headers:{"Content-Type":"text/plain;charset=utf-8"}, body:data})
        .catch(function(){ if (++tries < 3) setTimeout(go, 1500 * tries); });
    })();
  }
  function track(btn){ if (!S.payload) return; post(Object.assign({}, S.payload, {type:"click", button:btn, final:currentText(), edited:S.edited}), true); }
  var updTimer = null;
  function queueUpdate(){ clearTimeout(updTimer); updTimer = setTimeout(flushUpdate, 2500); }
  function flushUpdate(beacon){
    clearTimeout(updTimer); updTimer = null;
    if (!S.payload) return;
    var t = currentText(); if (t === S.lastSent) return;
    S.lastSent = t;
    post(Object.assign({}, S.payload, {type:"update", final:t, edited:S.edited}), beacon);
  }
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "hidden") flushUpdate(true); });
  window.addEventListener("pagehide", function(){ flushUpdate(true); });

  function submit(){
    if (refs.submit.disabled || refs.hp.value) return;
    S.postHTML = generate();
    var text = plain(S.postHTML).trim();
    S.payload = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      lang:S.lang, stars:S.stars,
      good:S.good.map(function(t){ return TERMS[t].ja; }).join("・"), goodDetail:detailText("good"),
      bad:S.bad.map(function(t){ return TERMS[t].ja; }).join("・"), badDetail:detailText("bad"),
      scene:(SCENES.filter(function(x){ return x.id === S.scene; })[0] || {}).ja || "",
      staffNote:S.good.indexOf("staff") >= 0 ? getDet("good", "staff").note.trim().slice(0, 60) : "",
      generated:text, final:text, edited:false, consent:refs.consent.checked,
      page:location.href.split("?")[0], src:(location.search.match(/[?&]src=([\w-]{1,20})/) || [])[1] || ""
    };
    S.lastSent = text;
    S.sent = true; build();
    try { window.scrollTo(0, 0); } catch (e) {}
    post(S.payload);
  }

  window.UNZEN_SURVEY = {S:S, generate:generate, setLang:setLang, DETAIL:DETAIL, TERMS:TERMS};
  build();
})();
</script>
